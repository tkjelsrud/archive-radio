<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>notoms archive radio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="player">
    <img class="logo" src="/badger-studio.png" alt="Badger Studio">

    <div class="art-slot" id="artSlot" title="Click to inspect/tag this clip">
      <span id="artPlaceholder">RADIO</span>
      <canvas id="waveform" width="220" height="220"></canvas>
    </div>

    <div class="meta">
      <div id="sourceFilename" class="filename">—</div>
      <div id="sourceLocation" class="location">—</div>
    </div>

    <div class="transport">
      <button id="btnPrev" title="Skip Back">⏮</button>
      <button id="btnPlay" title="Play/Pause">▶</button>
      <button id="btnNext" title="Skip Ahead">⏭</button>
    </div>

    <div id="status" class="status">Press play</div>

    <button id="btnFx" class="fx-toggle" title="Playback effects">FX</button>
    <div id="fxPanel" class="fx-panel hidden">
      <div class="fx-row">
        <label class="fx-label"><input type="checkbox" id="fxReverbToggle"> Reverb</label>
        <label class="fx-knob">Wet<input type="range" id="fxReverbWet" min="0" max="1" step="0.01" value="0.35"></label>
        <label class="fx-knob">Decay<input type="range" id="fxReverbDecay" min="0" max="1" step="0.01" value="0.45"></label>
      </div>
      <div class="fx-row">
        <label class="fx-label"><input type="checkbox" id="fxDelayToggle"> Delay</label>
        <label class="fx-knob">Wet<input type="range" id="fxDelayWet" min="0" max="1" step="0.01" value="0.35"></label>
        <label class="fx-knob">Decay<input type="range" id="fxDelayDecay" min="0" max="0.85" step="0.01" value="0.35"></label>
      </div>
    </div>
  </div>

  <div id="detailOverlay" class="detail-overlay hidden">
    <div class="detail-panel">
      <div class="detail-header">
        <span>Clip Detail</span>
        <span id="detailLoopIndicator" class="loop-indicator">looping</span>
      </div>

      <div id="detailFilename" class="filename">—</div>

      <div class="detail-section">
        <div class="detail-label">Tags</div>
        <div id="tagChips" class="tag-chips"></div>
        <div class="tag-input-row">
          <input id="tagInput" type="text" placeholder="add tag, Enter to confirm" list="tagSuggestions">
          <datalist id="tagSuggestions"></datalist>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-label">Note</div>
        <textarea id="noteInput" rows="2" placeholder="optional note"></textarea>
      </div>

      <div class="detail-section rating-actions">
        <button id="btnNotUsable" class="not-usable-btn" title="This one clip only">Not usable</button>
        <button id="btnBlacklistFile" class="blacklist-btn" title="Excludes every clip from this source file">Blacklist file</button>
      </div>

      <div class="detail-section detail-actions">
        <a id="btnDownloadClip" class="done-btn download-btn" href="#" download title="Download this compiled clip">Download</a>
        <button id="btnDetailDone" class="done-btn">Done</button>
      </div>
    </div>
  </div>

  <script src="/player.js"></script>
</body>
</html>
